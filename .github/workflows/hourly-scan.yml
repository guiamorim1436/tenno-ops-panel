name: TENNO Ops Hourly AI Scanner

on:
  schedule:
    # Roda a cada hora (minuto 0)
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  scan-whatsapp-groups:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger AI Group Scan
        run: |
          curl -s -X POST https://tenno-ops-panel.vercel.app/api/scan-groups
